<main class="section">

            <div class="airhockey-score-panel">

<script src="js/main-obf.js"></script>
<script>
(function() {
    const user = JSON.parse(localStorage.getItem("user"));
    const userInfo = document.getElementById("user-info");
    
    if (user && user.email) {
        const avatarUrl = user.avatar || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        userInfo.innerHTML = `
            <div class="profile-menu">
                <div class="profile-btn" onclick="toggleMenu()">
                    <img src="${avatarUrl}" class="avatar">
                    <span>${user.name}</span>
                </div>
                <div class="dropdown-menu" id="dropdown-menu">
                    <button onclick="logout()">Выйти</button>
                </div>
            </div>
        `;
        document.getElementById('airhockeyPlayerNameLabel').textContent = user.name;
    } else {
        userInfo.innerHTML = `<a href="lgpass.html" class="nav-list__link">Войти</a>`;
        window.location.href = 'lgpass.html';
        return;
    }
    
    window.toggleMenu = function() {
        document.getElementById("dropdown-menu")?.classList.toggle("show-menu");
    };
    window.logout = function() {
        localStorage.removeItem("user");
        window.location.href = 'lgpass.html';
    };
    
    const canvas = document.getElementById('airhockeyCanvas');
    const ctx = canvas.getContext('2d');
    
    const W = canvas.width;
    const H = canvas.height;
    const CENTER_X = W / 2;
    const CENTER_Y = H / 2;
    
    const WALL_TOP = 22;
    const WALL_BOTTOM = H - 22;
    const WALL_LEFT = 16;
    const WALL_RIGHT = W - 16;
    
    const PADDLE_RADIUS = 23;
    const PUCK_RADIUS = 17;
    
    const GOAL_WIDTH = 130;
    const GOAL_HEIGHT = 16;
    const AI_GOAL = { x: CENTER_X - GOAL_WIDTH/2, y: WALL_TOP - 10, w: GOAL_WIDTH, h: GOAL_HEIGHT };
    const PLAYER_GOAL = { x: CENTER_X - GOAL_WIDTH/2, y: WALL_BOTTOM - GOAL_HEIGHT + 10, w: GOAL_WIDTH, h: GOAL_HEIGHT };
    
    let playerPaddle = { x: CENTER_X, y: H - 80 };
    let aiPaddle = { x: CENTER_X, y: WALL_TOP + 55 };
    let puck = { x: CENTER_X, y: CENTER_Y, vx: 0, vy: 0 };
    
    let playerScore = 0;
    let aiScore = 0;
    let currentWinScore = 10;
    let currentDifficulty = 0;
    let currentDifficultyName = "ЛЕГКИЙ";
    
    let gameActive = false;
    let paused = false;
    let isCountdown = false;
    let goalMessageTimer = null;
    
    let lastPlayTime = 0;
    
    let playerTargetX = CENTER_X;
    let playerTargetY = H - 80;
    
    let countdownTimeout = null;
    
    let sounds = {
        hit: null,
        gol: null,
        win: null,
        count3: null,
        count2: null,
        count1: null,
        started: null
    };
    
    let gameStartTime = Date.now();
    let totalPlaySeconds = 0;
    let playInterval = null;
    
    function saveAirhockeyStats(goals, playTimeSec) {
        if (!user || !user.email) return;
        const key = `airhockey_stats_${user.name}`;
        let stats = { goals: 0, playTime: 0 };
        const existing = localStorage.getItem(key);
        if (existing) stats = JSON.parse(existing);
        if (goals > stats.goals) stats.goals = goals;
        if (playTimeSec > stats.playTime) stats.playTime = playTimeSec;
        localStorage.setItem(key, JSON.stringify(stats));
        
        fetch('https://shopify-server-3iuh.onrender.com/api/airhockey/stats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userEmail: user.email, goals: stats.goals, playTime: stats.playTime })
        }).catch(e => console.warn('Stat send error', e));
    }
    
    function startPlayTimer() {
        if (playInterval) clearInterval(playInterval);
        gameStartTime = Date.now();
        playInterval = setInterval(() => {
            if (gameActive && !paused && !isCountdown) {
                totalPlaySeconds = Math.floor((Date.now() - gameStartTime) / 1000);
            }
        }, 1000);
    }
    
    function stopPlayTimer() {
        if (playInterval) clearInterval(playInterval);
        if (gameActive) saveAirhockeyStats(playerScore, totalPlaySeconds);
    }
    
    function preloadSounds() {
        sounds.hit = new Audio('assets/airhockey.mp3');
        sounds.hit.volume = 0.35;
        sounds.hit.load();
        sounds.gol = new Audio('assets/gol.mp3');
        sounds.gol.volume = 0.5;
        sounds.gol.load();
        sounds.win = new Audio('assets/airwin.mp3');
        sounds.win.volume = 0.5;
        sounds.win.load();
        sounds.count3 = new Audio('assets/3.mp3');
        sounds.count3.volume = 0.5;
        sounds.count3.load();
        sounds.count2 = new Audio('assets/2.mp3');
        sounds.count2.volume = 0.5;
        sounds.count2.load();
        sounds.count1 = new Audio('assets/1.mp3');
        sounds.count1.volume = 0.5;
        sounds.count1.load();
        sounds.started = new Audio('assets/started.mp3');
        sounds.started.volume = 0.5;
        sounds.started.load();
    }
    
    function playHitSound() {
        if (!gameActive) return;
        const now = Date.now();
        if (now - lastPlayTime < 30) return;
        lastPlayTime = now;
        try {
            const sound = sounds.hit.cloneNode();
            sound.volume = 0.35;
            sound.play().catch(e => console.log('Sound error:', e));
        } catch(e) {}
    }
    
    function playCountSound(num) {
        try {
            let sound = null;
            if (num === 3) sound = sounds.count3.cloneNode();
            else if (num === 2) sound = sounds.count2.cloneNode();
            else if (num === 1) sound = sounds.count1.cloneNode();
            if (sound) {
                sound.volume = 0.5;
                sound.play().catch(e => console.log('Count sound error:', e));
            }
        } catch(e) {}
    }
    
    function playStartedSound() {
        try {
            const sound = sounds.started.cloneNode();
            sound.volume = 0.5;
            sound.play().catch(e => console.log('Started sound error:', e));
        } catch(e) {}
    }
    
    function playGolSound() {
        try {
            const sound = sounds.gol.cloneNode();
            sound.volume = 0.5;
            sound.play().catch(e => console.log('Gol sound error:', e));
        } catch(e) {}
    }
    
    function playWinSound() {
        try {
            const sound = sounds.win.cloneNode();
            sound.volume = 0.5;
            sound.play().catch(e => console.log('Win sound error:', e));
        } catch(e) {}
    }
    
    const difficulties = [
        { name: "ЛЕГКИЙ", winScore: 10, aiSpeed: 0.07, returnSpeed: 0.04, power: 0.9, maxSpeed: 7.0 },
        { name: "СРЕДНИЙ", winScore: 20, aiSpeed: 0.085, returnSpeed: 0.045, power: 1.0, maxSpeed: 7.5 },
        { name: "СЛОЖНЫЙ", winScore: 30, aiSpeed: 0.1, returnSpeed: 0.05, power: 1.1, maxSpeed: 8.0 },
        { name: "ЭКСТРИМАЛЬНЫЙ", winScore: 40, aiSpeed: 0.12, returnSpeed: 0.055, power: 1.2, maxSpeed: 8.5 },
        { name: "БЕЗУМНЫЙ", winScore: 50, aiSpeed: 0.14, returnSpeed: 0.06, power: 1.3, maxSpeed: 9.0 }
    ];
    
    function showDifficultyMenu() {
        const overlay = document.createElement('div');
        overlay.className = 'airhockey-difficulty-overlay';
        overlay.id = 'difficultyOverlay';
        overlay.innerHTML = `
            <div class="airhockey-difficulty-modal">
                <div class="airhockey-difficulty-title">ВЫБОР СЛОЖНОСТИ</div>
                <div class="airhockey-slider-container">
                    <input type="range" min="0" max="4" step="1" value="0" class="airhockey-slider" id="difficultySlider">
                    <div class="airhockey-difficulty-name" id="difficultyName">ЛЕГКИЙ</div>
                    <div class="airhockey-goal-target" id="goalTarget">НУЖНО ЗАБИТЬ: 10 ГОЛОВ</div>
                </div>
                <button class="airhockey-play-btn" id="startGameBtn">ИГРАТЬ</button>
            </div>
        `;
        document.body.appendChild(overlay);
        
        const slider = document.getElementById('difficultySlider');
        const difficultyNameSpan = document.getElementById('difficultyName');
        const goalTargetSpan = document.getElementById('goalTarget');
        
        function updateDifficulty(val) {
            currentDifficulty = parseInt(val);
            currentDifficultyName = difficulties[currentDifficulty].name;
            currentWinScore = difficulties[currentDifficulty].winScore;
            difficultyNameSpan.textContent = currentDifficultyName;
            goalTargetSpan.textContent = `НУЖНО ЗАБИТЬ: ${currentWinScore} ГОЛОВ`;
        }
        
        slider.addEventListener('input', (e) => updateDifficulty(e.target.value));
        updateDifficulty(0);
        
        document.getElementById('startGameBtn').addEventListener('click', () => {
            overlay.remove();
            resetGame();
        });
    }
    
    function updateScoreUI() {
        document.getElementById('airhockeyPlayerScore').textContent = playerScore;
        document.getElementById('airhockeyAIScore').textContent = aiScore;
        const subtitle = document.querySelector('.airhockey-subtitle');
        if (subtitle) {
            subtitle.textContent = `Игра против ИИ – забей ${currentWinScore} голов! (${currentDifficultyName})`;
        }
    }
    
    function showGoalMessage(goalType) {
        if (goalMessageTimer) clearTimeout(goalMessageTimer);
        const msgDiv = document.getElementById('airhockeyGoalMessage');
        msgDiv.style.display = 'block';
        msgDiv.style.animation = 'none';
        msgDiv.offsetHeight;
        msgDiv.style.animation = 'airhockeyGoalPulse 0.5s ease-out';
        gameActive = false;
        playGolSound();
        
        goalMessageTimer = setTimeout(() => {
            msgDiv.style.display = 'none';
            resetPuck();
            startCountdown();
        }, 1200);
    }
    
    function resetPuck() {
        puck.x = CENTER_X;
        puck.y = CENTER_Y;
        puck.vx = 0;
        puck.vy = 0;
    }
    
    function startCountdown() {
        if (countdownTimeout) clearTimeout(countdownTimeout);
        isCountdown = true;
        gameActive = false;
        
        let step = 0;
        const steps = [
            { text: "3", sound: () => playCountSound(3), nextDelay: 1000 },
            { text: "2", sound: () => playCountSound(2), nextDelay: 1000 },
            { text: "1", sound: () => playCountSound(1), nextDelay: 1000 },
            { text: "НАЧАЛИ!", sound: () => playStartedSound(), nextDelay: 600 }
        ];
        
        const countdownDiv = document.getElementById('airhockeyCountdown');
        
        function runStep() {
            if (step >= steps.length) {
                countdownDiv.style.display = 'none';
                isCountdown = false;
                const direction = Math.random() < 0.5 ? -1 : 1;
                const angle = (Math.random() - 0.5) * Math.PI / 2.8;
                const speed = 4.8;
                puck.vx = Math.sin(angle) * speed;
                puck.vy = direction * Math.cos(angle) * speed;
                gameActive = true;
                startPlayTimer();
                return;
            }
            
            const currentStep = steps[step];
            countdownDiv.textContent = currentStep.text;
            countdownDiv.style.display = 'block';
            countdownDiv.style.animation = 'airhockeyCountdownPulse 0.6s ease-out';
            currentStep.sound();
            step++;
            countdownTimeout = setTimeout(runStep, currentStep.nextDelay);
        }
        
        countdownDiv.style.display = 'block';
        runStep();
    }
    
    function handleCollisions() {
        const maxSpeed = difficulties[currentDifficulty].maxSpeed;
        
        const dxPlayer = puck.x - playerPaddle.x;
        const dyPlayer = puck.y - playerPaddle.y;
        const distPlayer = Math.hypot(dxPlayer, dyPlayer);
        if (distPlayer < PUCK_RADIUS + PADDLE_RADIUS) {
            const angle = Math.atan2(dyPlayer, dxPlayer);
            const overlap = PUCK_RADIUS + PADDLE_RADIUS - distPlayer;
            puck.x += Math.cos(angle) * overlap;
            puck.y += Math.sin(angle) * overlap;
            const currentSpeed = Math.hypot(puck.vx, puck.vy);
            const newVx = Math.cos(angle) * currentSpeed * 1.15;
            const newVy = Math.sin(angle) * currentSpeed * 1.15;
            const offset = (dxPlayer / PADDLE_RADIUS) * 2;
            puck.vx = newVx + offset;
            puck.vy = newVy;
            if (puck.vy > 0) puck.vy = -Math.abs(puck.vy) - 2;
            puck.vx = Math.min(Math.max(puck.vx, -maxSpeed), maxSpeed);
            puck.vy = Math.min(Math.max(puck.vy, -maxSpeed), maxSpeed);
            playHitSound();
        }
        
        const dxAi = puck.x - aiPaddle.x;
        const dyAi = puck.y - aiPaddle.y;
        const distAi = Math.hypot(dxAi, dyAi);
        if (distAi < PUCK_RADIUS + PADDLE_RADIUS) {
            const angle = Math.atan2(dyAi, dxAi);
            const overlap = PUCK_RADIUS + PADDLE_RADIUS - distAi;
            puck.x += Math.cos(angle) * overlap * 0.7;
            puck.y += Math.sin(angle) * overlap * 0.7;
            const currentSpeed = Math.hypot(puck.vx, puck.vy);
            const power = difficulties[currentDifficulty].power;
            const newVx = Math.cos(angle) * currentSpeed * power;
            const newVy = Math.sin(angle) * currentSpeed * power;
            const offset = (dxAi / PADDLE_RADIUS) * 1.2;
            puck.vx = newVx + offset;
            puck.vy = newVy;
            if (puck.vy < 0) puck.vy = -Math.abs(puck.vy) - 3;
            else puck.vy = Math.abs(puck.vy) + 3;
            puck.vx = Math.min(Math.max(puck.vx, -maxSpeed), maxSpeed);
            puck.vy = Math.min(Math.max(puck.vy, -maxSpeed), maxSpeed);
            playHitSound();
        }
        
        if (puck.x - PUCK_RADIUS < WALL_LEFT) {
            puck.x = WALL_LEFT + PUCK_RADIUS;
            puck.vx = -puck.vx * 0.96;
            playHitSound();
        }
        if (puck.x + PUCK_RADIUS > WALL_RIGHT) {
            puck.x = WALL_RIGHT - PUCK_RADIUS;
            puck.vx = -puck.vx * 0.96;
            playHitSound();
        }
        
        if (puck.y - PUCK_RADIUS < WALL_TOP) {
            const inGoal = (puck.x > AI_GOAL.x && puck.x < AI_GOAL.x + AI_GOAL.w);
            if (inGoal) {
                playerScore++;
                updateScoreUI();
                showGoalMessage('player');
                saveAirhockeyStats(playerScore, totalPlaySeconds);
                saveGameResult('airhockey', playerScore);
                if (playerScore >= currentWinScore) {
                    gameActive = false;
                    playWinSound();
                    if (currentDifficulty < difficulties.length - 1) {
                        currentDifficulty++;
                        currentDifficultyName = difficulties[currentDifficulty].name;
                        currentWinScore = difficulties[currentDifficulty].winScore;
                        setTimeout(() => {
                            alert(`ПОБЕДА! Переход на ${currentDifficultyName} уровень!`);
                            resetGame();
                        }, 500);
                    } else {
                        setTimeout(() => { alert('ПОБЕДА! Вы прошли игру!'); showDifficultyMenu(); }, 500);
                    }
                }
            } else {
                puck.y = WALL_TOP + PUCK_RADIUS;
                puck.vy = -puck.vy * 0.96;
                playHitSound();
            }
        }
        
        if (puck.y + PUCK_RADIUS > WALL_BOTTOM) {
            const inGoal = (puck.x > PLAYER_GOAL.x && puck.x < PLAYER_GOAL.x + PLAYER_GOAL.w);
            if (inGoal) {
                aiScore++;
                updateScoreUI();
                showGoalMessage('ai');
                if (aiScore >= currentWinScore) {
                    gameActive = false;
                    playWinSound();
                    setTimeout(() => { alert('ПОРАЖЕНИЕ! Игра начата заново.'); showDifficultyMenu(); }, 500);
                }
            } else {
                puck.y = WALL_BOTTOM - PUCK_RADIUS;
                puck.vy = -puck.vy * 0.96;
                playHitSound();
            }
        }
    }
    
    let aiTargetX = CENTER_X;
    let aiTargetY = WALL_TOP + 55;
    
    function updateAI() {
        if (!gameActive || paused || isCountdown) return;
        let targetX = CENTER_X;
        let targetY = WALL_TOP + 55;
        const isPuckInAITerritory = puck.y - PUCK_RADIUS < CENTER_Y - 20;
        const isPuckNearWall = (puck.x - PUCK_RADIUS < WALL_LEFT + 25) || (puck.x + PUCK_RADIUS > WALL_RIGHT - 25);
        const isPuckInCorner = isPuckNearWall && (puck.y - PUCK_RADIUS < WALL_TOP + 40);
        
        if (isPuckInAITerritory && !isPuckInCorner) {
            targetX = puck.x;
            targetY = puck.y;
            const safeMargin = 28;
            targetX = Math.min(Math.max(targetX, WALL_LEFT + PADDLE_RADIUS + safeMargin), WALL_RIGHT - PADDLE_RADIUS - safeMargin);
            targetY = Math.min(Math.max(targetY, WALL_TOP + PADDLE_RADIUS + 15), CENTER_Y - PADDLE_RADIUS - 30);
        } else if (isPuckInCorner) {
            targetX = CENTER_X;
            targetY = WALL_TOP + 50;
        }
        
        let speed = difficulties[currentDifficulty].returnSpeed;
        if (isPuckInAITerritory && !isPuckInCorner) {
            speed = difficulties[currentDifficulty].aiSpeed;
        }
        aiTargetX += (targetX - aiTargetX) * speed;
        aiTargetY += (targetY - aiTargetY) * speed;
        aiPaddle.x = aiTargetX;
        aiPaddle.y = aiTargetY;
        aiPaddle.x = Math.min(Math.max(aiPaddle.x, WALL_LEFT + PADDLE_RADIUS), WALL_RIGHT - PADDLE_RADIUS);
        aiPaddle.y = Math.min(Math.max(aiPaddle.y, WALL_TOP + PADDLE_RADIUS + 10), CENTER_Y - PADDLE_RADIUS - 20);
    }
    
    function updatePuck() {
        if (!gameActive || paused || isCountdown) return;
        puck.x += puck.vx;
        puck.y += puck.vy;
        handleCollisions();
        puck.vx *= 0.999;
        puck.vy *= 0.999;
    }
    
    canvas.addEventListener('mousemove', (e) => {
        if (!gameActive || paused || isCountdown) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX;
        let mouseY = (e.clientY - rect.top) * scaleY;
        playerTargetX = Math.min(Math.max(mouseX, WALL_LEFT + PADDLE_RADIUS), WALL_RIGHT - PADDLE_RADIUS);
        playerTargetY = Math.min(Math.max(mouseY, CENTER_Y + 18 + PADDLE_RADIUS), WALL_BOTTOM - PADDLE_RADIUS);
    });
    
    function resetGame() {
        if (countdownTimeout) clearTimeout(countdownTimeout);
        stopPlayTimer();
        saveAirhockeyStats(playerScore, totalPlaySeconds);
        playerScore = 0;
        aiScore = 0;
        updateScoreUI();
        playerPaddle.x = CENTER_X;
        playerPaddle.y = H - 80;
        playerTargetX = CENTER_X;
        playerTargetY = H - 80;
        aiPaddle.x = CENTER_X;
        aiPaddle.y = WALL_TOP + 55;
        aiTargetX = CENTER_X;
        aiTargetY = WALL_TOP + 55;
        puck.x = CENTER_X;
        puck.y = CENTER_Y;
        puck.vx = 0;
        puck.vy = 0;
        gameActive = false;
        if (goalMessageTimer) clearTimeout(goalMessageTimer);
        document.getElementById('airhockeyGoalMessage').style.display = 'none';
        startCountdown();
    }
    
    function togglePause() {
        if (isCountdown) return;
        paused = !paused;
        const modal = document.getElementById('airhockeyPauseModal');
        modal.style.display = paused ? 'flex' : 'none';
        if (paused) {
            if (playInterval) clearInterval(playInterval);
        } else {
            if (gameActive && !isCountdown) {
                gameStartTime = Date.now() - totalPlaySeconds * 1000;
                playInterval = setInterval(() => {
                    if (gameActive && !paused && !isCountdown) {
                        totalPlaySeconds = Math.floor((Date.now() - gameStartTime) / 1000);
                    }
                }, 1000);
            }
        }
    }
    
    function drawField() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = '#5C62EC';
        ctx.lineWidth = 3;
        ctx.strokeRect(WALL_LEFT - 2, WALL_TOP - 2, WALL_RIGHT - WALL_LEFT + 4, WALL_BOTTOM - WALL_TOP + 4);
        ctx.beginPath();
        ctx.strokeStyle = '#ff4444';
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 14]);
        ctx.moveTo(WALL_LEFT, CENTER_Y);
        ctx.lineTo(WALL_RIGHT, CENTER_Y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.strokeStyle = '#2266cc';
        ctx.lineWidth = 2.5;
        ctx.arc(CENTER_X, CENTER_Y, 48, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#2266cc';
        ctx.beginPath();
        ctx.arc(CENTER_X - 135, CENTER_Y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(CENTER_X + 135, CENTER_Y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = '#ff4444';
        ctx.lineWidth = 2;
        ctx.moveTo(WALL_LEFT, CENTER_Y - 100);
        ctx.lineTo(WALL_RIGHT, CENTER_Y - 100);
        ctx.stroke();
        ctx.moveTo(WALL_LEFT, CENTER_Y + 100);
        ctx.lineTo(WALL_RIGHT, CENTER_Y + 100);
        ctx.stroke();
        ctx.fillStyle = '#2266cc';
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y - 75, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y + 75, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2a2a3a';
        ctx.fillRect(AI_GOAL.x, AI_GOAL.y, AI_GOAL.w, AI_GOAL.h);
        ctx.fillRect(PLAYER_GOAL.x, PLAYER_GOAL.y, PLAYER_GOAL.w, PLAYER_GOAL.h);
        ctx.fillStyle = '#1a1a2a';
        ctx.fillRect(AI_GOAL.x + 3, AI_GOAL.y + 3, AI_GOAL.w - 6, AI_GOAL.h - 6);
        ctx.fillRect(PLAYER_GOAL.x + 3, PLAYER_GOAL.y + 3, PLAYER_GOAL.w - 6, PLAYER_GOAL.h - 6);
        ctx.strokeStyle = '#ff6666';
        ctx.lineWidth = 2;
        ctx.strokeRect(AI_GOAL.x + 2, AI_GOAL.y + 2, AI_GOAL.w - 4, AI_GOAL.h - 4);
        ctx.strokeRect(PLAYER_GOAL.x + 2, PLAYER_GOAL.y + 2, PLAYER_GOAL.w - 4, PLAYER_GOAL.h - 4);
    }
    
    function drawPaddle(paddle) {
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(paddle.x, paddle.y, PADDLE_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#cc2222';
        ctx.beginPath();
        ctx.arc(paddle.x, paddle.y, PADDLE_RADIUS - 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff8888';
        ctx.beginPath();
        ctx.arc(paddle.x, paddle.y, PADDLE_RADIUS - 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    function drawPuck() {
        ctx.shadowBlur = 4;
        ctx.fillStyle = '#2266dd';
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, PUCK_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4488ff';
        ctx.beginPath();
        ctx.arc(puck.x, puck.y, PUCK_RADIUS - 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    function animate() {
        playerPaddle.x += (playerTargetX - playerPaddle.x) * 0.25;
        playerPaddle.y += (playerTargetY - playerPaddle.y) * 0.25;
        updateAI();
        updatePuck();
        drawField();
        drawPaddle(playerPaddle);
        drawPaddle(aiPaddle);
        drawPuck();
        requestAnimationFrame(animate);
    }
    
    function init() {
        preloadSounds();
        showDifficultyMenu();
        animate();
    }
    
    document.getElementById('airhockeyNewGameBtn').addEventListener('click', () => {
        if (goalMessageTimer) clearTimeout(goalMessageTimer);
        if (countdownTimeout) clearTimeout(countdownTimeout);
        showDifficultyMenu();
    });
    document.getElementById('airhockeyPauseBtn').addEventListener('click', () => togglePause());
    document.getElementById('airhockeyResumeBtn').addEventListener('click', () => togglePause());
    
    init();
})();
</script>
</body>
</html>
