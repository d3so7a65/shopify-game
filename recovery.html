<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div id="step1" class="step active">
            <div class="logo-icon"><i class='bx bx-joystick'></i></div>
            <h1>Восстановление пароля</h1>
            <div class="auth-subtitle">Мы отправим код для сброса пароля</div>
            <div class="input-box">
                <input type="email" id="email" placeholder="Введите ваш Email" required>
                <i class='bx bx-envelope input-icon'></i>
            </div>
            <button class="btn" id="sendCodeBtn">Отправить код</button>
            <div id="formMessage1" class="form-message"></div>
            <div class="register-link">
                <p><a href="lgpass.html">← Вернуться ко входу</a></p>
            </div>
        </div>

        <div id="step2" class="step">
            <div class="logo-icon"><i class='bx bx-key'></i></div>
            <h1>Подтверждение кода</h1>
            <div class="auth-subtitle">Введите код из письма</div>
            <div class="input-box">
                <input type="text" id="code" placeholder="Введите код из письма" maxlength="6">
                <i class='bx bx-key input-icon'></i>
            </div>
            <button class="btn" id="verifyCodeBtn">Подтвердить код</button>
            <div id="formMessage2" class="form-message"></div>
            <div class="register-link">
                <p><a href="#" id="backToStep1">← Назад</a></p>
            </div>
        </div>

        <div id="step3" class="step">
            <div class="logo-icon"><i class='bx bx-lock-alt'></i></div>
            <h1>Новый пароль</h1>
            <div class="auth-subtitle">Придумайте новый пароль</div>
            <div class="input-box">
                <input type="password" id="newPassword" placeholder="Введите новый пароль">
                <i class='bx bxs-lock-alt input-icon'></i>
                <i class='bx bx-hide eye-icon' id="togglePassword"></i>
            </div>
            <button class="btn" id="resetPasswordBtn">Сбросить пароль</button>
            <div id="formMessage3" class="form-message"></div>
            <div class="register-link">
                <p><a href="#" id="backToStep1FromStep3">← Назад</a></p>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = "";
        let currentCode = "";
        let isSending = false;
        let isResetting = false;
        let countdownInterval = null;
        let resendTimeout = null;

        function showMessage(text, isSuccess = false, step = 1) {
            let msgBox;
            if (step === 1) msgBox = document.getElementById("formMessage1");
            else if (step === 2) msgBox = document.getElementById("formMessage2");
            else msgBox = document.getElementById("formMessage3");
            
            msgBox.textContent = text;
            msgBox.className = `form-message ${isSuccess ? 'success' : 'error'}`;
            msgBox.style.display = 'block';
            setTimeout(() => {
                if (msgBox.style.display === 'block') {
                    msgBox.style.display = 'none';
                }
            }, 5000);
        }

        function showStep(stepNumber) {
            document.getElementById("step1").classList.remove("active");
            document.getElementById("step2").classList.remove("active");
            document.getElementById("step3").classList.remove("active");
            document.getElementById(`step${stepNumber}`).classList.add("active");
            
            // Очищаем таймер при смене шага
            if (stepNumber !== 2 && countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        function goToStep1() {
            showStep(1);
            document.getElementById("email").value = "";
            document.getElementById("code").value = "";
            document.getElementById("newPassword").value = "";
            currentEmail = "";
            currentCode = "";
            document.getElementById("formMessage1").style.display = "none";
            document.getElementById("formMessage2").style.display = "none";
            document.getElementById("formMessage3").style.display = "none";
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        function startCountdown(seconds) {
            let remaining = seconds;
            const countdownElement = document.getElementById('countdown');
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            countdownInterval = setInterval(() => {
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownElement.innerHTML = '<a href="#" id="resendCodeBtn" style="color: #667eea;">Отправить код повторно</a>';
                    
                    const resendBtn = document.getElementById('resendCodeBtn');
                    if (resendBtn) {
                        resendBtn.onclick = (e) => {
                            e.preventDefault();
                            resendCode();
                        };
                    }
                } else {
                    countdownElement.textContent = `Повторная отправка через ${remaining} секунд`;
                    remaining--;
                }
            }, 1000);
        }
        
        async function resendCode() {
            if (!currentEmail) return;
            
            const sendBtn = document.getElementById("sendCodeBtn");
            isSending = true;
            
            try {
                const response = await fetch(`${API_BASE_URL}/send-recovery-code`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ email: currentEmail })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    currentCode = result.code;
                    showMessage("Код отправлен повторно!", true, 2);
                    startCountdown(60);
                } else {
                    showMessage(result.message || "Ошибка отправки", false, 2);
                }
            } catch (error) {
                console.error('Resend error:', error);
                showMessage("Ошибка подключения к серверу", false, 2);
            } finally {
                isSending = false;
            }
        }

        document.getElementById("backToStep1").onclick = function(e) {
            e.preventDefault();
            goToStep1();
        };

        document.getElementById("backToStep1FromStep3").onclick = function(e) {
            e.preventDefault();
            goToStep1();
        };

        const togglePassword = document.getElementById("togglePassword");
        if (togglePassword) {
            togglePassword.addEventListener("click", function() {
                const passwordInput = document.getElementById("newPassword");
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                this.classList.toggle("bx-show");
                this.classList.toggle("bx-hide");
            });
        }

        // Обработка Enter
        document.getElementById("email").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                document.getElementById("sendCodeBtn").click();
            }
        });
        
        document.getElementById("code").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                document.getElementById("verifyCodeBtn").click();
            }
        });
        
        document.getElementById("newPassword").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                document.getElementById("resetPasswordBtn").click();
            }
        });

        document.getElementById("sendCodeBtn").onclick = async function() {
            if (isSending) return;
            
            const email = document.getElementById("email").value.trim();
            
            if (!email) {
                showMessage("Введите Email", false, 1);
                return;
            }
            if (!/^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email)) {
                showMessage("Введите корректный email адрес", false, 1);
                return;
            }

            currentEmail = email;
            const sendBtn = document.getElementById("sendCodeBtn");
            isSending = true;
            sendBtn.disabled = true;
            sendBtn.textContent = "Отправка...";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(`${API_BASE_URL}/send-recovery-code`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ email: email }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                
                let result;
                try {
                    result = await response.json();
                } catch (e) {
                    throw new Error("Неверный ответ от сервера");
                }

                if (response.ok) {
                    currentCode = result.code;
                    showMessage("Код отправлен на вашу почту!", true, 1);
                    showStep(2);
                    startCountdown(60);
                } else {
                    showMessage(result.message || "Пользователь не найден", false, 1);
                }
            } catch (error) {
                console.error('Send code error:', error);
                let errorText = "Ошибка подключения к серверу. Проверьте консоль.";
                if (error.name === "AbortError") {
                    errorText = "Сервер не отвечает. Попробуйте позже.";
                } else if (error.message === "Неверный ответ от сервера") {
                    errorText = error.message;
                }
                showMessage(errorText, false, 1);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Отправить код";
                isSending = false;
            }
        };

        document.getElementById("verifyCodeBtn").onclick = function() {
            const inputCode = document.getElementById("code").value.trim();
            
            if (!inputCode) {
                showMessage("Введите код из письма", false, 2);
                return;
            }
            
            if (inputCode.length !== 6) {
                showMessage("Код должен содержать 6 цифр", false, 2);
                return;
            }

            if (inputCode !== currentCode) {
                showMessage("Неверный код", false, 2);
                return;
            }

            showMessage("Код подтверждён! Введите новый пароль", true, 2);
            showStep(3);
        };

        document.getElementById("resetPasswordBtn").onclick = async function() {
            if (isResetting) return;
            
            const newPassword = document.getElementById("newPassword").value;
            
            if (!newPassword) {
                showMessage("Введите новый пароль", false, 3);
                return;
            }
            if (newPassword.length < 6) {
                showMessage("Пароль должен содержать минимум 6 символов", false, 3);
                return;
            }
            
            // Проверка сложности пароля
            if (!/(?=.*[a-z])(?=.*[A-Z])/.test(newPassword)) {
                showMessage("Пароль должен содержать заглавные и строчные буквы", false, 3);
                return;
            }

            const resetBtn = document.getElementById("resetPasswordBtn");
            isResetting = true;
            resetBtn.disabled = true;
            resetBtn.textContent = "Сохранение...";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({ 
                        email: currentEmail, 
                        newPassword: newPassword 
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                
                let result;
                try {
                    result = await response.json();
                } catch (e) {
                    throw new Error("Неверный ответ от сервера");
                }

                if (response.ok) {
                    showMessage("Пароль успешно изменён! Перенаправление...", true, 3);
                    setTimeout(() => {
                        window.location.href = "lgpass.html";
                    }, 1500);
                } else {
                    showMessage(result.message || "Ошибка при смене пароля", false, 3);
                }
            } catch (error) {
                console.error('Reset password error:', error);
                let errorText = "Ошибка подключения к серверу";
                if (error.name === "AbortError") {
                    errorText = "Сервер не отвечает. Попробуйте позже.";
                } else if (error.message === "Неверный ответ от сервера") {
                    errorText = error.message;
                }
                showMessage(errorText, false, 3);
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = "Сбросить пароль";
                isResetting = false;
            }
        };

        // Проверка доступности API при загрузке страницы
        async function checkAPIHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`, {
                    method: "GET",
                    timeout: 5000
                });
                if (!response.ok) {
                    console.warn('API health check failed');
                }
            } catch (error) {
                console.warn('API server might be offline:', error.message);
            }
        }
        
        // Запускаем проверку
        checkAPIHealth();
        
        // Инструкция по настройке
        console.log('%c📧 Настройка SMTP для восстановления пароля', 'color: #667eea; font-size: 16px; font-weight: bold;');
        console.log('%c1. Установите зависимости: npm install nodemailer express cors', 'color: #666;');
        console.log('%c2. Создайте бэкенд сервер на Render/Railway/Koyeb/Cyclic', 'color: #666;');
        console.log('%c3. Добавьте переменные окружения: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS', 'color: #666;');
        console.log('%c4. Замените API_BASE_URL на URL вашего сервера', 'color: #666;');
    </script>
</body>
</html>
</body>
</html>
